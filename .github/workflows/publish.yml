name: Publish

on:
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  package:
    name: Build release package
    if: ${{ vars.NPM_PUBLISH_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      package-file: ${{ steps.package.outputs.file }}
    steps:
      - name: Check out release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - name: Require release commit on main
        run: git merge-base --is-ancestor HEAD origin/main
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Validate release tag
        env:
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: >-
          node -e
          'const pkg = require("./package.json");
          const expected = "v" + pkg.version;
          const tag = process.env.RELEASE_TAG;
          const versionIsPrerelease = pkg.version.includes("-");
          const releaseIsPrerelease = process.env.RELEASE_PRERELEASE === "true";
          if (!/^v\d+\.\d+\.\d+(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/.test(tag) || tag !== expected) {
          console.error("Expected release tag " + expected + ", received " + tag);
          process.exit(1);
          }
          if (versionIsPrerelease !== releaseIsPrerelease) {
          console.error("GitHub prerelease status must match package version " + pkg.version);
          process.exit(1);
          }'
      - run: npm ci
      - run: npm run verify
      - name: Create release package
        id: package
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir release
          PACKAGE_FILE="capacitor-oidc-${RELEASE_TAG#v}.tgz"
          npm pack --pack-destination release
          test -f "release/$PACKAGE_FILE"
          echo "file=$PACKAGE_FILE" >> "$GITHUB_OUTPUT"
      - name: Upload release package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: release/${{ steps.package.outputs.file }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    name: Publish to npm
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm-production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Require npm trusted-publishing support
        run: >-
          node -e
          'const version = require("node:child_process")
          .execFileSync("npm", ["--version"], { encoding: "utf8" }).trim();
          const [major, minor, patch] = version.split(".").map(Number);
          if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) {
          console.error("npm 11.5.1 or newer is required, received " + version);
          process.exit(1);
          }'
      - name: Download release package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: release
      - name: Validate package artifact
        env:
          PACKAGE_FILE: ${{ needs.package.outputs.package-file }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: >-
          node -e
          'const manifest = JSON.parse(require("node:child_process")
          .execFileSync("tar", ["-xOf", "release/" + process.env.PACKAGE_FILE, "package/package.json"],
          { encoding: "utf8" }));
          const expectedVersion = process.env.RELEASE_TAG.slice(1);
          if (manifest.name !== "capacitor-oidc" || manifest.version !== expectedVersion) {
          console.error("Expected capacitor-oidc@" + expectedVersion + ", received " +
          manifest.name + "@" + manifest.version);
          process.exit(1);
          }'
      - name: Publish package
        env:
          NPM_TAG: ${{ github.event.release.prerelease && 'next' || 'latest' }}
          PACKAGE_FILE: ${{ needs.package.outputs.package-file }}
        run: npm publish "./release/$PACKAGE_FILE" --ignore-scripts --access public --tag "$NPM_TAG"
